[package]
name = "ex_netcdf"
version = "0.1.0"
authors = []
edition = "2018"

[lib]
name = "ex_netcdf"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = { version = "0.37.0" , features = ["nif_version_2_16"] }
netcdf = { version = "0.11.1", features = ["static"] }
thiserror = "1"
ndarray = "0.16.1"
